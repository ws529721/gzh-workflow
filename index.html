<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>公众号合作 · 内容支持计划</title>
  <style>
    :root {
      --bg: #f4f7fb;
      --card: #ffffff;
      --text: #1f2a37;
      --muted: #6b7280;
      --blue: #1677ff;
      --blue-deep: #0f5ed8;
      --orange: #ff6b35;
      --green: #07c160;
      --border: #e5e7eb;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.7;
    }

    .container {
      max-width: 780px;
      margin: 0 auto;
      padding: 24px 16px 40px;
    }

    .hero {
      background: linear-gradient(135deg, #0f172a 0%, #1e3a8a 100%);
      color: white;
      padding: 28px 20px;
      border-radius: 20px;
      box-shadow: 0 12px 30px rgba(15, 23, 42, 0.16);
      text-align: center;
    }

    .hero h1 {
      margin: 0 0 10px;
      font-size: 24px;
      line-height: 1.35;
    }

    .hero p {
      margin: 0;
      color: rgba(255, 255, 255, 0.8);
      font-size: 15px;
    }

    .chip {
      display: inline-block;
      margin-top: 12px;
      padding: 7px 12px;
      background: rgba(255, 255, 255, 0.15);
      border: 1px solid rgba(255, 255, 255, 0.22);
      border-radius: 999px;
      font-size: 12px;
      letter-spacing: 1px;
      color: #dbeafe;
    }

    .card {
      margin-top: 16px;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 18px;
      padding: 18px;
      box-shadow: 0 8px 22px rgba(15, 23, 42, 0.05);
    }

    .card-title {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 18px;
      font-weight: 800;
      margin-bottom: 8px;
    }

    .card-title .icon {
      font-size: 22px;
    }

    .card p {
      color: var(--muted);
      margin: 0 0 12px;
      font-size: 14px;
    }

    .btn-grid {
      display: grid;
      gap: 12px;
    }

    .btn {
      display: flex;
      align-items: center;
      justify-content: space-between;
      width: 100%;
      padding: 14px 16px;
      border-radius: 14px;
      text-decoration: none;
      color: white;
      font-weight: 700;
      border: none;
      cursor: pointer;
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }

    .btn:hover {
      transform: translateY(-1px);
      box-shadow: 0 8px 16px rgba(0, 0, 0, 0.08);
    }

    .btn-blue {
      background: linear-gradient(135deg, var(--blue), var(--blue-deep));
    }

    .btn-orange {
      background: linear-gradient(135deg, var(--orange), #e04d16);
    }

    .btn-green {
      background: linear-gradient(135deg, var(--green), #059669);
    }

    .btn-purple {
      background: linear-gradient(135deg, #7c3aed, #5b21b6);
    }

    .btn .right {
      font-size: 20px;
      opacity: 0.95;
    }

    /* 前置条件 */
    .req-card {
      margin-top: 16px;
      background: #fffdf0;
      border: 2px solid #ffc107;
      border-radius: 16px;
      padding: 18px 20px;
      box-shadow: 0 4px 16px rgba(255, 193, 7, 0.15);
    }

    .req-card .req-title {
      font-size: 15px;
      font-weight: 800;
      color: #e65100;
      margin-bottom: 10px;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .req-grid {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
    }

    .req-item {
      flex: 1 1 auto;
      min-width: 100px;
      background: #fff;
      border: 1px solid #ffe0b0;
      border-radius: 12px;
      padding: 12px 14px;
      text-align: center;
      font-size: 13px;
      font-weight: 700;
      color: #e65100;
    }

    .req-item .req-icon {
      font-size: 20px;
      display: block;
      margin-bottom: 4px;
    }

    /* 文员隐蔽入口 */
    .clerk-link {
      text-align: center;
      margin-top: 24px;
      font-size: 10px;
      color: #dde1e8;
      letter-spacing: 0.5px;
    }

    .clerk-link a {
      color: #dde1e8;
      text-decoration: none;
      cursor: default;
    }

    .clerk-link a:hover {
      color: #c5cad4;
    }

    .meta {
      margin-top: 10px;
      padding: 10px 12px;
      border-radius: 12px;
      background: #f8fafc;
      border: 1px dashed #d6dee8;
      font-size: 13px;
      color: #4b5563;
      word-break: break-all;
    }

    .footer {
      margin-top: 18px;
      text-align: center;
      font-size: 13px;
      color: #7a869a;
    }

    @media (max-width: 600px) {
      .container {
        padding: 16px 12px 30px;
      }

      .hero {
        padding: 24px 16px;
      }

      .hero h1 {
        font-size: 22px;
      }
    }
  </style>
</head>

<body>
  <div class="container">
    <div class="hero">
      <h1>公众号内容合作</h1>
      <p>你提供账号 · 我们提供内容 · 合作共赢</p>
      <div class="chip">简单 · 透明 · 可控</div>
    </div>

    <!-- 前置硬性条件 -->
    <div class="req-card">
      <div class="req-title"><span>⚠️</span> 合作前请确认以下条件：</div>
      <div class="req-grid">
        <div class="req-item">
          <span class="req-icon">🪪</span>微信实名认证
        </div>
        <div class="req-item">
          <span class="req-icon">🎂</span>本人满18周岁
        </div>
        <div class="req-item">
          <span class="req-icon">💳</span>已绑定本人银行卡
        </div>
      </div>
    </div>

    <div class="card">
      <div class="card-title"><span class="icon">📌</span> 请选择你要看的内容</div>
      <p>先了解合作方式，再按指引操作。每一步都清晰明了。</p>
      <div class="btn-grid">
        <a class="btn btn-blue" href="项目介绍.html" target="_blank">
          <span>📖 项目介绍</span>
          <span class="right">›</span>
        </a>
        <a class="btn btn-orange" href="扫码工作流_一步步操作指引.html" target="_blank">
          <span>📋 公众号操作指引</span>
          <span class="right">›</span>
        </a>
      </div>
    </div>

    <div class="card">
      <div class="card-title"><span class="icon">🔗</span> 推荐发给客户的入口</div>
      <p>把下面这个地址发给客户，对方打开就能看到所有内容：</p>
      <div class="meta">https://ws529721.github.io/gzh-workflow/</div>
    </div>

    <!-- 文员入口缩小 -->
    <div class="clerk-link">
      · <a href="文员手册.html" target="_blank">.</a> ·
    </div>

    <div class="footer">持续更新中 · 合作咨询请加微信</div>
  </div>
</body>

</html>
