<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport"
        content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no,viewport-fit=cover" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="AI创作助手" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="theme-color" content="#0f172a" />
    <link rel="manifest" href="manifest.json" />
    <title>多账号AI创作助手</title>
    <style>
        :root {
            --bg: #f0f2f5;
            --c: #fff;
            --t: #1a1a2e;
            --mu: #999;
            --bl: #2563eb;
            --gn: #16a34a;
            --or: #ea580c;
            --rd: #dc2626;
            --bd: #e5e7eb;
            --r: 16px;
            --sf: env(safe-area-inset-bottom, 0px)
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent
        }

        body {
            font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
            background: var(--bg);
            color: var(--t);
            line-height: 1.6;
            padding-bottom: calc(80px + var(--sf));
            -webkit-font-smoothing: antialiased;
            overscroll-behavior: none
        }

        .hdr {
            background: linear-gradient(135deg, #0f172a, #1e3a8a);
            color: #fff;
            padding: 14px 16px;
            position: sticky;
            top: 0;
            z-index: 100;
            text-align: center;
            display: flex;
            align-items: center;
            justify-content: space-between
        }

        .hdr h1 {
            font-size: 18px;
            font-weight: 800
        }

        .hdr .st {
            font-size: 10px;
            opacity: .7
        }

        .ctn {
            max-width: 500px;
            margin: 0 auto;
            padding: 10px 10px 40px
        }

        .card {
            background: var(--c);
            border-radius: var(--r);
            padding: 14px;
            margin-bottom: 10px;
            box-shadow: 0 1px 2px rgba(0, 0, 0, .03);
            border: 1px solid var(--bd)
        }

        .ct {
            font-size: 14px;
            font-weight: 700;
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            gap: 6px
        }

        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 5px;
            padding: 10px 18px;
            border-radius: 10px;
            font-size: 13px;
            font-weight: 600;
            border: none;
            cursor: pointer;
            transition: all .12s;
            touch-action: manipulation;
            white-space: nowrap
        }

        .btn:active {
            transform: scale(.95);
            opacity: .8
        }

        .btn-p {
            background: var(--bl);
            color: #fff
        }

        .btn-s {
            background: var(--gn);
            color: #fff
        }

        .btn-o {
            background: #fff;
            border: 1.5px solid var(--bl);
            color: var(--bl)
        }

        .btn-r {
            background: #fff;
            border: 1.5px solid var(--rd);
            color: var(--rd)
        }

        .btn-w {
            background: var(--or);
            color: #fff
        }

        .btn-sm {
            padding: 7px 12px;
            font-size: 11px;
            border-radius: 8px
        }

        .btn-blk {
            width: 100%
        }

        .btn:disabled {
            opacity: .4;
            pointer-events: none
        }

        input,
        select,
        textarea {
            width: 100%;
            padding: 10px 12px;
            border: 1.5px solid var(--bd);
            border-radius: 10px;
            font-size: 14px;
            font-family: inherit;
            background: #f9fafb;
            -webkit-appearance: none
        }

        input:focus,
        select:focus {
            outline: none;
            border-color: var(--bl);
            box-shadow: 0 0 0 3px rgba(37, 99, 235, .06)
        }

        label {
            display: block;
            font-size: 12px;
            font-weight: 600;
            color: var(--mu);
            margin-bottom: 3px;
            margin-top: 8px
        }

        label:first-child {
            margin-top: 0
        }

        .badge {
            display: inline-block;
            padding: 2px 8px;
            border-radius: 20px;
            font-size: 10px;
            font-weight: 600;
            vertical-align: middle
        }

        .badge-g {
            background: #dcfce7;
            color: #166534
        }

        .badge-b {
            background: #dbeafe;
            color: #1e40af
        }

        .badge-y {
            background: #fef9c3;
            color: #854d0e
        }

        .badge-r {
            background: #fee2e2;
            color: #991b1b
        }

        .row {
            display: flex;
            gap: 8px
        }

        .col {
            flex: 1;
            min-width: 0
        }

        .nav {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: rgba(255, 255, 255, .94);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-top: 1px solid var(--bd);
            display: flex;
            padding: 4px 0 var(--sf);
            z-index: 100
        }

        .nav-btn {
            flex: 1;
            text-align: center;
            padding: 4px;
            font-size: 10px;
            color: var(--mu);
            cursor: pointer;
            border: none;
            background: none;
            font-family: inherit
        }

        .nav-btn .nv {
            font-size: 20px;
            display: block;
            margin-bottom: 1px
        }

        .nav-btn.on {
            color: var(--bl)
        }

        .pg {
            display: none
        }

        .pg.on {
            display: block
        }

        .toast {
            position: fixed;
            top: 16px;
            left: 50%;
            transform: translateX(-50%);
            padding: 10px 20px;
            border-radius: 10px;
            color: #fff;
            font-weight: 600;
            z-index: 999;
            font-size: 13px;
            pointer-events: none;
            opacity: 0;
            transition: opacity .3s
        }

        .toast.show {
            opacity: 1
        }

        .toast-ok {
            background: var(--gn)
        }

        .toast-err {
            background: var(--rd)
        }

        .modal-overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, .45);
            z-index: 200;
            align-items: flex-end;
            justify-content: center
        }

        .modal-overlay.show {
            display: flex
        }

        .modal {
            background: #fff;
            border-radius: 20px 20px 0 0;
            padding: 18px 14px calc(18px + var(--sf));
            width: 100%;
            max-width: 500px;
            max-height: 90vh;
            overflow-y: auto;
            animation: su .25s
        }

        @keyframes su {
            from {
                transform: translateY(100%)
            }

            to {
                transform: translateY(0)
            }
        }

        .empty {
            text-align: center;
            padding: 30px 14px;
            color: var(--mu)
        }

        .empty .ic {
            font-size: 40px;
            margin-bottom: 6px
        }

        .prog {
            height: 4px;
            background: #e5e7eb;
            border-radius: 2px;
            overflow: hidden;
            margin: 8px 0
        }

        .prog-fill {
            height: 100%;
            background: var(--bl);
            border-radius: 2px;
            transition: width .4s;
            width: 0%
        }

        .art-preview {
            background: #fff;
            border: 1px solid var(--bd);
            border-radius: 8px;
            padding: 14px;
            margin: 6px 0;
            max-height: 220px;
            overflow-y: auto;
            font-size: 13px;
            line-height: 1.7
        }

        .art-preview h2 {
            font-size: 14px;
            margin: 10px 0 5px
        }

        .art-preview strong {
            color: #1a1a2e
        }

        .art-preview blockquote {
            background: #f0f4ff;
            padding: 8px 12px;
            border-radius: 6px;
            margin: 8px 0;
            border-left: 3px solid #818cf8;
            font-size: 12px;
            color: #555
        }

        .install-banner {
            background: linear-gradient(135deg, #1e3a8a, #2563eb);
            color: #fff;
            padding: 12px 16px;
            border-radius: 12px;
            margin-bottom: 10px;
            display: none;
            align-items: center;
            gap: 10px;
            cursor: pointer;
            font-size: 13px;
            font-weight: 600
        }

        .editor-toolbar {
            display: flex;
            gap: 4px;
            padding: 8px;
            background: #f8f9fa;
            border-radius: 8px 8px 0 0;
            border: 1px solid var(--bd);
            border-bottom: none;
            flex-wrap: wrap
        }

        .editor-toolbar button {
            width: 32px;
            height: 30px;
            border: 1px solid #ddd;
            background: #fff;
            border-radius: 6px;
            font-size: 14px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center
        }

        .editor-toolbar button:active {
            background: #e5e7eb
        }

        .editor-area {
            min-height: 200px;
            max-height: 50vh;
            overflow-y: auto;
            padding: 12px;
            border: 1px solid var(--bd);
            border-radius: 0 0 8px 8px;
            font-size: 14px;
            line-height: 1.8;
            outline: none;
            background: #fff
        }

        .arts-actions {
            display: flex;
            gap: 6px;
            margin-top: 8px;
            flex-wrap: wrap
        }
    </style>
</head>

<body>
    <div class="hdr">
        <h1>🤖 AI创作助手</h1><span class="st" id="st"></span>
    </div>
    <div class="install-banner" id="install-banner" onclick="installApp()">📲 点击安装到手机桌面，像App一样使用 →</div>
    <div class="ctn">
        <div class="pg on" id="pg-dash">
            <div class="card">
                <div class="ct">📊 账号概览</div>
                <div id="dash-acc"></div>
            </div>
            <div class="card">
                <div class="ct">📝 最近记录</div>
                <div id="dash-rec"></div>
            </div>
            <div class="card">
                <div class="ct">⚡ 快捷操作</div><button class="btn btn-p btn-blk" onclick="swTab('create')">✍️
                    AI生成文章</button><button class="btn btn-s btn-blk" style="margin-top:6px" onclick="batchAll()">📤
                    一键推送全部</button>
            </div>
        </div>
        <div class="pg" id="pg-create">
            <div class="card">
                <div class="ct">🎯 创作中心</div>
                <label>选择账号</label><select id="sel-acc"></select>
                <label>垂直主题</label><select id="sel-topic"></select>
                <label>AI模型</label><select id="sel-model"></select>
                <label>生成篇数</label><select id="sel-n">
                    <option value="1">1篇</option>
                    <option value="3">3篇</option>
                    <option value="6" selected>6篇</option>
                </select>
                <button class="btn btn-p btn-blk" style="margin-top:12px" id="btn-gen">🚀 生成文章</button>
                <div id="gen-prog" style="display:none;margin-top:8px">
                    <div class="prog">
                        <div class="prog-fill" id="prog-fill"></div>
                    </div>
                    <p style="font-size:10px;color:var(--mu);text-align:center" id="prog-txt"></p>
                </div>
            </div>
            <div id="art-out"></div>
        </div>
        <div class="pg" id="pg-accts">
            <div id="acct-list"></div>
            <button class="btn btn-p btn-blk" onclick="showAddAcct()">➕ 添加账号</button>
            <button class="btn btn-o btn-blk" style="margin-top:6px" onclick="exportAccts()">📋 导出</button>
            <button class="btn btn-o btn-blk" style="margin-top:6px" onclick="document.getElementById('fi').click()">📥
                导入</button>
            <input type="file" id="fi" style="display:none" accept=".json" onchange="importAccts(event)" />
        </div>
        <div class="pg" id="pg-set">
            <div class="card">
                <div class="ct">🔑 AI密钥</div><label>DeepSeek Key</label><input type="password" id="key-ds"
                    placeholder="sk-..." /><label>OpenAI Key</label><input type="password" id="key-oai"
                    placeholder="sk-..." />
            </div>
            <div class="card">
                <div class="ct">🖥️ 推送服务器</div><label>地址（电脑IP:3456）</label><input id="set-sv"
                    placeholder="http://192.168.x.x:3456" /><button class="btn btn-sm btn-o" style="margin-top:6px"
                    onclick="testSv()">🔍 测试</button>
            </div>
            <div class="card">
                <div class="ct">✏️ 作者</div><label>名称</label><input id="set-au" value="铃木村" /><button
                    class="btn btn-p btn-blk" style="margin-top:10px" onclick="saveSets()">💾 保存设置</button>
            </div>
        </div>
    </div>
    <div class="nav">
        <div class="nav-btn on" data-pg="dash"><span class="nv">📊</span>仪表盘</div>
        <div class="nav-btn" data-pg="create"><span class="nv">✍️</span>创作</div>
        <div class="nav-btn" data-pg="accts"><span class="nv">👤</span>账号</div>
        <div class="nav-btn" data-pg="set"><span class="nv">⚙️</span>设置</div>
    </div>
    <div class="modal-overlay" id="md-acct">
        <div class="modal">
            <h2 style="margin-bottom:12px">➕ 公众号账号</h2><label>名称</label><input id="md-nm" /><label>AppID</label><input
                id="md-ap" /><label>AppSecret</label><input id="md-sc" /><label>IP</label><input id="md-ip"
                value="115.206.224.39" /><label>主题</label><select id="md-tp"></select>
            <div class="row" style="margin-top:12px"><button class="btn btn-o col"
                    onclick="clsMd('md-acct')">取消</button><button class="btn btn-p col" id="btn-sv-acct">保存</button>
            </div>
        </div>
    </div>
    <div class="modal-overlay" id="md-edit">
        <div class="modal">
            <h2 style="margin-bottom:8px">✏️ 编辑文章</h2>
            <div class="editor-toolbar"><button onclick="docCmd('bold')" title="加粗"><b>B</b></button><button
                    onclick="docCmd('italic')" title="斜体"><i>I</i></button><button onclick="docCmd('underline')"
                    title="下划线"><u>U</u></button><button onclick="docCmd('formatBlock','h2')"
                    title="标题">H</button><button onclick="docCmd('insertUnorderedList')" title="列表">•</button><button
                    onclick="docCmd('formatBlock','blockquote')" title="引用">❝</button></div>
            <div class="editor-area" id="editor-area" contenteditable="true"></div>
            <div class="row" style="margin-top:10px"><button class="btn btn-o col"
                    onclick="clsMd('md-edit')">取消</button><button class="btn btn-p col" id="btn-sv-edit">💾
                    保存修改</button></div>
        </div>
    </div>
    <div class="modal-overlay" id="md-push">
        <div class="modal">
            <h2 style="margin-bottom:10px">📤 推送确认</h2>
            <div id="push-sum"></div>
            <div class="row" style="margin-top:10px"><button class="btn btn-o col"
                    onclick="clsMd('md-push')">取消</button><button class="btn btn-s col" id="btn-do-push">✅ 确认</button>
            </div>
        </div>
    </div>
