function exportAccts(){var a=LS.get('accts',[]);if(!a.length){toast('无账号','err');return}var b=new Blob([JSON.stringify(a,null,2)],{type:'application/json'});var u=URL.createObjectURL(b);var d=document.createElement('a');d.href=u;d.download='accounts_backup.json';d.click();toast('已导出')}
function importAccts(e){var f=e.target.files[0];if(!f)return;var r=new FileReader();r.onload=function(ev){try{var d=JSON.parse(ev.target.result);if(!Array.isArray(d)){toast('格式错','err');return}var a=LS.get('accts',[]);for(var i=0;i<d.length;i++){if(d[i].ap&&d[i].sc)a.push({nm:d[i].nm||d[i].name,ap:d[i].ap||d[i].appid,sc:d[i].sc||d[i].secret,ip:d[i].ip||'',tp:d[i].tp||d[i].topic||'通用职场效率'})}LS.set('accts',a);ldAccts();ldDash();ldCreate();toast('导入'+d.length+'个')}catch(ex){toast('格式错','err')}};r.readAsText(f);e.target.value=''}
function ldCreate(){var a=LS.get('accts',[]),sa=document.getElementById('sel-acc');if(a.length){var h='';for(var i=0;i<a.length;i++){h+='<option value="'+i+'">'+(a[i].nm||'未命名')+'('+(a[i].tp||'')+')</option>'}sa.innerHTML=h}else{sa.innerHTML='<option>请先加账号</option>'}document.getElementById('sel-topic').innerHTML=Object.keys(TP).map(function(k){return'<option value="'+k+'">'+k+'</option>'}).join('');document.getElementById('sel-model').innerHTML='<option value="deepseek">DeepSeek V4 Pro</option><option value="openai">OpenAI GPT-4o</option>'}
async function doGen(){var a=LS.get('accts',[]),ai=parseInt(document.getElementById('sel-acc').value);if(isNaN(ai)||!a[ai]){toast('选账号','err');return}var t=TP[document.getElementById('sel-topic').value]||TP["通用职场效率"],m=document.getElementById('sel-model').value,n=parseInt(document.getElementById('sel-n').value),s=LS.get('stt',{}),key=m==='deepseek'?s.ds:s.oa,au=s.au||'铃木村',pg=document.getElementById('gen-prog'),pf=document.getElementById('prog-fill'),pt=document.getElementById('prog-txt');pg.style.display='block';pf.style.width='5%';pt.textContent='生成中...';var arts=[],useAI=!!key;if(useAI){try{for(var i=1;i<=n;i++){pf.style.width=Math.round(i/n*80)+'%';pt.textContent='AI第'+i+'/'+n+'篇...';var pr='为"'+t.ind+'"领域写爆款公众号文章。要求:1)故事化开头2)4-5小节emoji标题3)重点加粗4)案例:'+t.c1+t.c2+'5)工具:'+t.t1+t.t2+'6)1200字7)文末:发送【工具】领取8)禁词:副业网赚暴利月入。纯HTML(只用p,h2,strong,blockquote)',bu=m==='deepseek'?'https://api.deepseek.com/v1':'https://api.openai.com/v1',r=await fetch(bu+'/chat/completions',{method:'POST',headers:{'Content-Type':'application/json',Authorization:'Bearer '+key},body:JSON.stringify({model:m==='deepseek'?'deepseek-chat':'gpt-4o',messages:[{role:'system',content:'你是资深新媒体编辑。输出纯HTML公众号文章。'},{role:'user',content:pr}],max_tokens:4096,temperature:0.8})}),d=await r.json(),c=d.choices?d.choices[0].message.content:'';arts.push({n:i,title:t.ind+'·AI提效第'+i+'篇',html:'<section>'+Hhdr(au)+c+Hcta+'</section>',ai:ai})}}catch(e){useAI=false;arts.length=0;toast('AI失败用模板','err')}}if(!useAI){for(var i=1;i<=n;i++){pf.style.width=Math.round(i/n*80)+'%';pt.textContent='模板'+i+'/'+n+'...';arts.push({n:i,title:t.ind+'·AI提效第'+i+'篇',html:genHTML(i,t,au),ai:ai})}}pf.style.width='100%';pt.textContent='✅';window._arts=arts;renderArts(arts);var rc=LS.get('rec',[]);rc.push({t:t.ind+' '+n+'篇',s:'已生成',tm:new Date().toLocaleTimeString()});if(rc.length>30)rc.shift();LS.set('rec',rc);setTimeout(function(){pg.style.display='none'},1200);ldDash()}

function renderArts(arts){var el=document.getElementById('art-out'),h='<div class="card"><div class="ct">📄 结果('+arts.length+'篇)</div>';for(var i=0;i<arts.length;i++){h+='<div style="margin-bottom:8px;border:1px solid var(--bd);border-radius:8px;overflow:hidden"><div style="padding:8px 12px;background:#f8f9ff;font-weight:600;font-size:12px;display:flex;justify-content:space-between;cursor:pointer" onclick="var n=this.nextElementSibling;n.style.display=n.style.display===\'none\'?\'block\':\'none\'"><span>📝第'+(i+1)+'篇</span><span>👁</span></div><div class="art-preview" style="display:none">'+arts[i].html+'</div><div class="arts-actions" style="padding:8px 12px;border-top:1px solid var(--bd)"><button class="btn btn-sm btn-s col" onclick="pushOne('+i+')">📤推送</button><button class="btn btn-sm btn-o col" onclick="editArt('+i+')">✏️修改</button></div></div>'}h+='<button class="btn btn-w btn-blk" style="margin-top:8px" onclick="batchAll()">⚡一键推送全部('+arts.length+'篇)</button></div>';el.innerHTML=h;window.scrollTo({top:el.offsetTop-60,behavior:'smooth'})}
function batchAll(){var arts=window._arts;if(!arts||!arts.length){toast('先生成文章','err');return}doPush(arts,'all')}
function pushOne(i){var arts=window._arts;if(!arts||!arts[i])return;doPush([arts[i]],'one')}

document.getElementById('btn-sv-edit').addEventListener('click',function(){var i=window._editIdx;if(i==null||!window._arts||!window._arts[i])return;window._arts[i].html=document.getElementById('editor-area').innerHTML;renderArts(window._arts);clsMd('md-edit');toast('已保存修改')});
function docCmd(cmd,val){document.execCommand(cmd,false,val||null);document.getElementById('editor-area').focus()}
function doPush(arts,type){if(!arts||!arts.length){toast('无文章','err');return}var a=LS.get('accts',[]),ai=arts[0].ai;if(ai==null||!a[ai]){toast('账号丢失','err');return}var acc=a[ai];document.getElementById('push-sum').innerHTML='<p><strong>账号：</strong>'+(acc.nm||'未命名')+'</p><p><strong>文章：</strong>'+arts.length+'篇</p>';window._pAcc=acc;window._pArts=arts;showMd('md-push')}
document.getElementById('btn-do-push').addEventListener('click',async function(){this.disabled=true;this.textContent='推送中...';var acc=window._pAcc,arts=window._pArts,s=LS.get('stt',{}),sv=s.sv||'',au=s.au||'铃木村',results=[];if(sv){try{var r=await fetch(sv+'/api/publish',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({account:{app_id:acc.ap,app_secret:acc.sc},articles:arts.map(function(x,i){return{index:i+1,title:x.title,content_html:x.html}}),author:au})}),d=await r.json();results=d.data||d.results||[]}catch(e){toast('服务器不可用，尝试直连','err');sv=''}}if(!sv){for(var i=0;i<arts.length;i++){try{var tr=await fetch('https://api.weixin.qq.com/cgi-bin/token?grant_type=client_credential&appid='+acc.ap+'&secret='+acc.sc),td=await tr.json();if(!td.access_token){results.push({index:i+1,status:'failed',error:'Token'});continue}var tk=td.access_token,pl={articles:[{title:arts[i].title||'AI文章',author:au,digest:(arts[i].title||'').substring(0,50),content:arts[i].html,content_source_url:'',thumb_media_id:'',need_open_comment:0,only_fans_can_comment:0}]},dr=await fetch('https://api.weixin.qq.com/cgi-bin/draft/add?access_token='+tk,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(pl)}),dd=await dr.json();if(dd.media_id){results.push({index:i+1,status:'success',draft_media_id:dd.media_id})}else{results.push({index:i+1,status:'failed',error:dd.errmsg||'unknown'})}}catch(e){results.push({index:i+1,status:'failed',error:e.message})}}}var suc=results.filter(function(r){return r.status==='success'}).length,fail=results.filter(function(r){return r.status==='failed'}).length;toast('推送：成功'+suc+(fail>0?'/失败'+fail:''),fail>0?'err':'ok');var rc=LS.get('rec',[]);rc.push({t:'推送'+suc+'/'+arts.length+'篇',s:suc===arts.length?'成功':'部分失败',tm:new Date().toLocaleTimeString()});LS.set('rec',rc);this.disabled=false;this.textContent='✅ 确认';clsMd('md-push');ldDash()});
