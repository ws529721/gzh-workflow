<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport"
        content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no,viewport-fit=cover" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="AI创作助手" />
    <meta name="theme-color" content="#0f172a" />
    <title>多账号AI创作助手</title>
    <style>
        :root {
            --bg: #f0f2f5;
            --card: #fff;
            --text: #1a1a2e;
            --muted: #999;
            --blue: #2563eb;
            --green: #16a34a;
            --orange: #ea580c;
            --red: #dc2626;
            --border: #e5e7eb;
            --radius: 16px;
            --safe: env(safe-area-inset-bottom, 0px)
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent
        }

        body {
            font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
            background: var(--bg);
            color: var(--text);
            line-height: 1.6;
            padding-bottom: calc(80px + var(--safe));
            -webkit-font-smoothing: antialiased
        }

        .hdr {
            background: linear-gradient(135deg, #0f172a, #1e3a8a);
            color: #fff;
            padding: 16px;
            position: sticky;
            top: 0;
            z-index: 100;
            text-align: center
        }

        .hdr h1 {
            font-size: 19px;
            font-weight: 800
        }

        .hdr .st {
            font-size: 11px;
            opacity: .7;
            margin-top: 2px
        }

        .ctn {
            max-width: 500px;
            margin: 0 auto;
            padding: 12px 12px 40px
        }

        .card {
            background: var(--card);
            border-radius: var(--radius);
            padding: 16px;
            margin-bottom: 12px;
            box-shadow: 0 1px 3px rgba(0, 0, 0, .04);
            border: 1px solid var(--border)
        }

        .ct {
            font-size: 15px;
            font-weight: 700;
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            gap: 8px
        }

        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            padding: 12px 22px;
            border-radius: 12px;
            font-size: 14px;
            font-weight: 600;
            border: none;
            cursor: pointer;
            transition: all .15s;
            touch-action: manipulation
        }

        .btn:active {
            transform: scale(.96);
            opacity: .85
        }

        .btn-p {
            background: var(--blue);
            color: #fff
        }

        .btn-s {
            background: var(--green);
            color: #fff
        }

        .btn-o {
            background: #fff;
            border: 1.5px solid var(--blue);
            color: var(--blue)
        }

        .btn-r {
            background: #fff;
            border: 1.5px solid var(--red);
            color: var(--red)
        }

        .btn-sm {
            padding: 7px 14px;
            font-size: 12px;
            border-radius: 8px
        }

        .btn-blk {
            width: 100%;
            justify-content: center
        }

        .btn:disabled {
            opacity: .5;
            pointer-events: none
        }

        input,
        select,
        textarea {
            width: 100%;
            padding: 11px 14px;
            border: 1.5px solid var(--border);
            border-radius: 12px;
            font-size: 15px;
            font-family: inherit;
            background: #f9fafb;
            -webkit-appearance: none
        }

        input:focus,
        select:focus {
            outline: none;
            border-color: var(--blue);
            box-shadow: 0 0 0 3px rgba(37, 99, 235, .08)
        }

        label {
            display: block;
            font-size: 13px;
            font-weight: 600;
            color: var(--muted);
            margin-bottom: 4px;
            margin-top: 10px
        }

        label:first-child {
            margin-top: 0
        }

        .badge {
            display: inline-block;
            padding: 3px 10px;
            border-radius: 20px;
            font-size: 11px;
            font-weight: 600
        }

        .badge-g {
            background: #dcfce7;
            color: #166534
        }

        .badge-b {
            background: #dbeafe;
            color: #1e40af
        }

        .badge-y {
            background: #fef9c3;
            color: #854d0e
        }

        .row {
            display: flex;
            gap: 10px
        }

        .col {
            flex: 1;
            min-width: 0
        }

        .nav {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: rgba(255, 255, 255, .92);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-top: 1px solid var(--border);
            display: flex;
            padding: 6px 0 var(--safe);
            z-index: 100
        }

        .nav-btn {
            flex: 1;
            text-align: center;
            padding: 6px;
            font-size: 10px;
            color: var(--muted);
            cursor: pointer;
            border: none;
            background: none;
            font-family: inherit
        }

        .nav-btn .nv {
            font-size: 22px;
            display: block;
            margin-bottom: 2px
        }

        .nav-btn.on {
            color: var(--blue)
        }

        .pg {
            display: none
        }

        .pg.on {
            display: block
        }

        .toast {
            position: fixed;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            padding: 12px 22px;
            border-radius: 12px;
            color: #fff;
            font-weight: 600;
            z-index: 999;
            font-size: 14px;
            pointer-events: none;
            opacity: 0;
            transition: opacity .3s
        }

        .toast.show {
            opacity: 1
        }

        .toast-ok {
            background: var(--green)
        }

        .toast-err {
            background: var(--red)
        }

        .modal-overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, .45);
            z-index: 200;
            align-items: flex-end;
            justify-content: center
        }

        .modal-overlay.show {
            display: flex
        }

        .modal {
            background: #fff;
            border-radius: 20px 20px 0 0;
            padding: 20px 16px calc(20px + var(--safe));
            width: 100%;
            max-width: 500px;
            max-height: 85vh;
            overflow-y: auto;
            animation: slideUp .25s
        }

        @keyframes slideUp {
            from {
                transform: translateY(100%)
            }

            to {
                transform: translateY(0)
            }
        }

        .empty {
            text-align: center;
            padding: 36px 16px;
            color: var(--muted)
        }

        .empty .ic {
            font-size: 44px;
            margin-bottom: 8px
        }

        .prog {
            height: 5px;
            background: #e5e7eb;
            border-radius: 3px;
            overflow: hidden;
            margin: 8px 0
        }

        .prog-fill {
            height: 100%;
            background: var(--blue);
            border-radius: 3px;
            transition: width .4s;
            width: 0%
        }

        .art-preview {
            background: #fff;
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 16px;
            margin: 8px 0;
            max-height: 260px;
            overflow-y: auto;
            font-size: 14px;
            line-height: 1.8
        }

        .art-preview h2 {
            font-size: 15px;
            margin: 14px 0 6px
        }

        .art-preview strong {
            color: #1a1a2e
        }

        .art-preview blockquote {
            background: #f0f4ff;
            padding: 10px 14px;
            border-radius: 8px;
            margin: 10px 0;
            border-left: 3px solid #818cf8;
            font-size: 13px;
            color: #555
        }
    </style>
</head>

    <div class="hdr">
        <h1>🤖 多账号AI创作助手</h1>
        <div class="st" id="st">就绪</div>

    <div class="ctn">

            <button class="btn btn-o btn-blk" style="margin-top:8px" onclick="exportAccts()">📋 导出账号</button>
            <button class="btn btn-o btn-blk" style="margin-top:8px" onclick="document.getElementById('fi').click()">📥

            <input type="file" id="fi" style="display:none" accept=".json" onchange="importAccts(event)" />
        </div>
        <div class="pg" id="pg-set">

                <label>OpenAI Key (可选)</label><input type="password" id="key-oai" placeholder="sk-..." />
            </div>
            <div class="card">
                <div class="ct">🖥️ 推送服务器</div>
                <label>服务器地址（电脑运行启动服务器.bat后填IP）</label><input id="set-server" placeholder="http://192.168.x.x:3456" />
                <button class="btn btn-sm btn-o" style="margin-top:6px" onclick="testServer()">🔍 测试连接</button>
            </div>
            <div class="card">

                <label>作者名称</label><input id="set-author" value="铃木村" />
                <button class="btn btn-p btn-blk" style="margin-top:12px" onclick="saveSets()">💾 保存设置</button>
            </div>
        </div>
    </div>
    <div class="nav">
        <div class="nav-btn on" data-pg="dash"><span class="nv">📊</span>仪表盘</div>
        <div class="nav-btn" data-pg="create"><span class="nv">✍️</span>创作</div>
        <div class="nav-btn" data-pg="accts"><span class="nv">👤</span>账号</div>
        <div class="nav-btn" data-pg="set"><span class="nv">⚙️</span>设置</div>
    </div>
    <div class="modal-overlay" id="md-acct">
        <div class="modal">

            <label>AppID</label><input id="md-appid" placeholder="wx..." />
            <label>AppSecret</label><input id="md-secret" placeholder="请输入" />
            <label>白名单IP</label><input id="md-ip" placeholder="115.206.224.39" />

            <div class="row" style="margin-top:14px"><button class="btn btn-o col"

            </div>
        </div>
    </div>
